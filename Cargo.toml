[package]
name = "cleanmebro"
version = "0.1.0"
edition = "2021"
description = "A glassy macOS menu bar health monitor with an AI-judged cleanup and Space Lens"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "persistence"] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
ureq = { version = "3", features = ["json"] }
tray-icon = "0.21"
libc = "0.2"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSGeometry", "NSArray", "NSString", "NSFileManager", "NSURL", "NSError"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWindow", "NSView", "NSVisualEffectView", "NSResponder", "NSColor", "NSRunningApplication", "NSWorkspace", "NSGraphics", "NSGlassEffectView", "NSAppearance", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSFontDescriptor", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
