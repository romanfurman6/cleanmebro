[package]
name = "cleanmebro"
version = "0.1.0"
edition = "2021"
description = "A glassy macOS menu bar health monitor with an AI-judged cleanup and Space Lens"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "persistence"] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
global-hotkey = "0.7"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
ureq = { version = "3", features = ["json"] }
# voice cleanup in the video viewer (DeepFilterNet3, embedded, pure Rust)
deep-filter-rt = "0.2"
ndarray = "0.17"
tray-icon = "0.21"
libc = "0.2"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSValue", "NSObject", "NSProcessInfo", "NSGeometry", "NSArray", "NSString", "NSFileManager", "NSURL", "NSError", "NSData", "NSDictionary", "NSBundle"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWindow", "NSView", "NSVisualEffectView", "NSResponder", "NSColor", "NSRunningApplication", "NSWorkspace", "NSGraphics", "NSGlassEffectView", "NSAppearance", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSFontDescriptor", "NSPasteboard", "NSScreen", "objc2-core-foundation", "objc2-quartz-core", "NSEvent"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger"] }
block2 = "0.6"
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNRequest", "VNRecognizeTextRequest", "VNRequestHandler", "VNObservation", "VNTypes", "objc2-core-foundation"] }
# screen recording
objc2-screen-capture-kit = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media"] }
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
dispatch2 = "0.3"
# speech to text in the video viewer (whisper.cpp; needs cmake to build)
whisper-rs = { version = "0.16", features = ["metal"] }

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
