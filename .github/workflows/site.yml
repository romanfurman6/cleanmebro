name: Website tests

on:
  pull_request:
    paths: ["site/**", "tests/site/**", ".github/workflows/site.yml"]
  push:
    branches: [main]
    paths: ["site/**", "tests/site/**", ".github/workflows/site.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test tests/site/core.test.mjs
      - name: Install Playwright and ffmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.48.2
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser smoke test
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tests/site/smoke.mjs
