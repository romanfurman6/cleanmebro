name: Claude review

# Claude reviews a pull request and leaves inline comments on real bugs.
# It runs when a PR is opened, reopened or marked ready for review (drafts are
# skipped), and again whenever the `claude-review` label is added, so a review
# after new pushes is one click instead of one run per push.
# Needs the repo secret CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`), or swap
# it for `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}`.
# The review only comments: it never approves, pushes or merges.
# Runs on GitHub's Linux runner: a review reads code and needs no Mac. Only
# Roman's own PRs are reviewed; everyone else's, and forks, are skipped.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]

jobs:
  review:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'romanfurman6' &&
      !startsWith(github.event.pull_request.head.ref, 'release/') &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
    runs-on: ubuntu-latest
    # Job-level, so an unrelated label (job skipped) never cancels a running review.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            CmdMeow is a macOS menu-bar app in Rust (src/), plus its website
            in site/ (static HTML/CSS/JS on GitHub Pages). Review this pull
            request for real defects. Skip style, naming and formatting.
            Read docs/ui-rules.md before judging UI changes.

            Look for, in this order:
            - correctness bugs: a realistic input or state that gives a wrong
              result, a crash, a panic, lost user data or files deleted that
              should have been kept, or deleted outright where the UI says
              they go to the Trash (Cleanup, Uninstaller, Disk Map)
            - privacy and security: user files, clipboard, dictation audio or
              text, screenshots or recordings leaving the Mac without the user
              asking (sharing uploads only on explicit action); secrets in code
            - macOS: permissions (Accessibility, Screen Recording, Microphone)
              handled when denied; work on the main thread that blocks the UI;
              behaviour on macOS 12, the minimum version
            - performance: scans or timers that run when nothing is shown,
              memory growth over a long session
            - website (site/): demo actions that do nothing or leave a list or
              count out of date, broken layout at phone width (390 px),
              JavaScript errors, controls that cannot be used by keyboard
            - missing tests for behaviour the PR changes in src/

            Test evidence: the PR's author (often a Claude thread) runs checks
            locally and records them in the PR description. Read it with
            `gh pr view`. If the PR changes src/ and does not name results for
            `cargo test` and `cargo clippy`, say so as the FIRST line of the
            summary and name the commands.

            Licences: never accept code copied from other projects (reference
            repos are for ideas only). If the PR adds vendored code, fonts,
            icons or new dependencies, check the licence allows it and is
            credited.

            For every finding, trace the path from a real caller or input to
            the failure before you post it; drop anything you cannot trace.
            Post each finding as an inline comment on the line it is about
            (mcp__github_inline_comment__create_inline_comment), saying what
            breaks, how to reproduce it and a concrete fix. Then post one
            short summary with `gh pr comment`: blockers first, or "No
            blocking issues found." Do not approve, request changes, push or
            merge.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
