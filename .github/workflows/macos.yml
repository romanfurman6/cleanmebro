name: macOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

      - name: Bundle CmdMeow.app (universal)
        run: UNIVERSAL=1 scripts/bundle-mac.sh

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: CmdMeow-macos
          path: target/bundle/*.zip
          if-no-files-found: error

